<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Giriş — Akıllı Aile Yemek Planlayıcı</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Akıllı Aile Yemek Planlayıcı</h1>

  <div class="card">
    <h2>Giriş Yap</h2>
    <form id="login-form">
      <label>İsim
        <select id="login-name" required></select>
      </label>
      <label>PIN
        <input type="password" id="login-pin" inputmode="numeric" maxlength="8" required>
      </label>
      <button type="submit">Giriş Yap</button>
    </form>
    <p id="login-error" class="error"></p>
  </div>

  <div class="card">
    <h2>Yeni Kullanıcı Oluştur</h2>
    <form id="register-form">
      <label>İsim
        <input type="text" id="register-name" required>
      </label>
      <label>PIN
        <input type="password" id="register-pin" inputmode="numeric" maxlength="8" required>
      </label>
      <button type="submit">Oluştur ve Giriş Yap</button>
    </form>
    <p id="register-error" class="error"></p>
  </div>

  <script src="api.js"></script>
  <script>
    async function loadUsers() {
      const select = document.getElementById("login-name");
      select.innerHTML = "";
      try {
        const users = await apiFetch("/users/");
        for (const u of users) {
          const opt = document.createElement("option");
          opt.value = u.name;
          opt.textContent = u.name;
          select.appendChild(opt);
        }
      } catch (e) {
        // kullanıcı listesi alınamadıysa formu boş bırak
      }
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("login-error");
      errorEl.textContent = "";
      try {
        await apiFetch("/users/login/", {
          method: "POST",
          body: JSON.stringify({
            name: document.getElementById("login-name").value,
            pin: document.getElementById("login-pin").value,
          }),
        });
        window.location.href = "meals.html";
      } catch (err) {
        showError(errorEl, err);
      }
    });

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("register-error");
      errorEl.textContent = "";
      const name = document.getElementById("register-name").value;
      const pin = document.getElementById("register-pin").value;
      try {
        await apiFetch("/users/", { method: "POST", body: JSON.stringify({ name, pin }) });
        await apiFetch("/users/login/", { method: "POST", body: JSON.stringify({ name, pin }) });
        window.location.href = "meals.html";
      } catch (err) {
        showError(errorEl, err);
      }
    });

    loadUsers();
  </script>
</body>
</html>
